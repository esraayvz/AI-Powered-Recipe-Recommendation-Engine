<!doctype html>
<!-- Sayfanın iskeleti. Başlık, yazı kutusu ve sonuçların duracağı boş yer burada.
     Renk ve yerleşim app.css dosyasındadır. Arama ve kartlar app.js dosyasındadır. -->
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarif Öneri Motoru</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="shell">
      <section class="hero" aria-label="Ana arama">
        <div class="brand">
          <!-- Çatal, tabak ve kaşık. Yuvarlak logo değil. -->
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 88 56" fill="none">
              <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 6v12M18 6v12M22 6v12" stroke-width="2" />
                <path d="M14 16.5h8" stroke-width="2" />
                <path d="M18 16.5V50" stroke-width="2.2" />
                <circle cx="46" cy="30" r="16.5" stroke-width="2.2" />
                <circle cx="46" cy="30" r="9.5" stroke-width="1.6" opacity="0.65" />
                <ellipse cx="72" cy="13" rx="5" ry="6.5" stroke-width="2" />
                <path d="M72 19.5V50" stroke-width="2.2" />
              </g>
            </svg>
          </div>
          <h1>Tarif Öneri Motoru</h1>
          <p>Ne istediğini doğal Türkçe yaz. Binlerce Türk mutfağı tarifi arasından en uygunlarını gerekçesiyle getirelim.</p>
        </div>
        <form class="search" id="form">
          <!-- Kullanıcının cümleyi yazdığı kutu. -->
          <label class="visually-hidden" for="query">Tarif isteğin</label>
          <textarea id="query" rows="4" placeholder="Örn. Elimde tavuk ve yoğurt var, fırında orta zorlukta bir şey..."></textarea>
          <div class="search-actions">
            <button class="cta" id="send" type="submit">Tarif öner</button>
            <span class="hint" id="hint">Veri setinden önerir</span>
          </div>
          <div class="examples" id="examples" aria-label="Örnek istekler"></div>
          <div class="status" id="status" role="status"></div>
        </form>
      </section>
      <!-- Tarif kartları app.js tarafından buraya yazılır. -->
      <section class="results" id="sonuclar" hidden aria-live="polite"></section>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
